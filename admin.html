<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Orders</title>
    <meta name="description" content="Admin panel to view all user orders.">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8f9fa; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">User Orders</h2>
        <div id="loading" class="loading">Loading orders...</div>
        <table class="table table-bordered table-striped d-none" id="orders-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>User Name</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Order Date</th>
                </tr>
            </thead>
            <tbody id="orders-body"></tbody>
        </table>
        <p id="no-orders" class="d-none text-muted">No orders found.</p>
    </div>

    <script>
        async function loadOrders() {
            try {
                const res = await fetch('/api/orders');
                if (!res.ok) throw new Error('Failed to fetch orders');
                const orders = await res.json();

                document.getElementById('loading').classList.add('d-none');

                if (orders.length === 0) {
                    document.getElementById('no-orders').classList.remove('d-none');
                    return;
                }

                const tbody = document.getElementById('orders-body');
                orders.forEach((order, i) => {
                    const date = new Date(order.order_date).toLocaleString();
                    tbody.innerHTML += `
                        <tr>
                            <td>${i + 1}</td>
                            <td>${order.user_name}</td>
                            <td>${order.product_name}</td>
                            <td>${order.quantity}</td>
                            <td>₹${order.price}</td>
                            <td>${date}</td>
                        </tr>
                    `;
                });

                document.getElementById('orders-table').classList.remove('d-none');
            } catch (err) {
                document.getElementById('loading').innerHTML = '<span class="error">Error loading orders: ' + err.message + '</span>';
            }
        }

        loadOrders();
    </script>
</body>
</html>
